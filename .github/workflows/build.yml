
name: Build Wokwi Custom Chips

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MQ-8 chip
        uses: wokwi/wokwi-chip-clang-action@main
        with:
          sources: "mq8.chip.c"

      - name: Save MQ-8 WASM
        run: cp dist/chip.wasm mq8.chip.wasm

      - name: Build INA219 chip
        uses: wokwi/wokwi-chip-clang-action@main
        with:
          sources: "ina219.chip.c"

      - name: Save INA219 WASM
        run: cp dist/chip.wasm ina219.chip.wasm

      - name: Upload custom chip files
        uses: actions/upload-artifact@v4
        with:
          name: ev-battery-custom-chips
          path: |
            mq8.chip.wasm
            mq8.chip.json
            ina219.chip.wasm
            ina219.chip.json
